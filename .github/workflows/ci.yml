name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: .NET (build + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Ponte.sln

      - name: Build
        run: dotnet build Ponte.sln -c Release --no-restore

      - name: Testes unitarios
        run: >
          dotnet test Ponte.sln -c Release --no-build
          --filter "Category!=Integration"
          --logger "trx;LogFilePrefix=unit"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      # Testcontainers sobe PostgreSQL, SQL Server e RabbitMQ reais no Docker do runner.
      - name: Testes de integracao (Testcontainers)
        run: >
          dotnet test Ponte.sln -c Release --no-build
          --filter "Category=Integration"
          --logger "trx;LogFilePrefix=integration"
          --results-directory TestResults

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  frontend:
    name: React (typecheck + testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ponte-console
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ponte-console/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: gateway
            project: src/Gateway/Ponte.Gateway/Ponte.Gateway.csproj
            assembly: Ponte.Gateway
          - name: ingestion
            project: src/Services/Ingestion/Ponte.Ingestion.Api/Ponte.Ingestion.Api.csproj
            assembly: Ponte.Ingestion.Api
          - name: delivery
            project: src/Services/Delivery/Ponte.Delivery.Api/Ponte.Delivery.Api.csproj
            assembly: Ponte.Delivery.Api
          - name: management
            project: src/Services/Management/Ponte.Management.Api/Ponte.Management.Api.csproj
            assembly: Ponte.Management.Api
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Dockerfile
          build-args: |
            PROJECT=${{ matrix.project }}
            ASSEMBLY=${{ matrix.assembly }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/ponte-${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
